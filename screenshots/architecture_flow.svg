<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="100%" height="100%" style="background:#0f172a; font-family:'Segoe UI',system-ui,-apple-system,sans-serif;">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#38bdf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0284c7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7e22ce;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#047857;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Title Banner -->
  <text x="450" y="50" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="700" letter-spacing="1">AI RESEARCH &amp; REPORT GENERATOR</text>
  <text x="450" y="80" text-anchor="middle" fill="#94a3b8" font-size="14">CrewAI Autonomous Multi-Agent Collaborative Architecture</text>

  <!-- Input Topic Box -->
  <rect x="50" y="140" width="180" height="90" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>
  <text x="140" y="175" text-anchor="middle" fill="#38bdf8" font-size="14" font-weight="600">INPUT TOPIC</text>
  <text x="140" y="200" text-anchor="middle" fill="#cbd5e1" font-size="12">User Prompt / Query</text>

  <!-- Arrow 1 -->
  <path d="M 230 185 L 290 185" stroke="#38bdf8" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <polygon points="290,185 280,180 280,190" fill="#38bdf8"/>

  <!-- Agent 1: Senior Research Analyst -->
  <rect x="300" y="125" width="230" height="120" rx="12" fill="url(#grad1)" filter="url(#shadow)"/>
  <text x="415" y="160" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">🔍 Research Agent</text>
  <text x="415" y="185" text-anchor="middle" fill="#e0f2fe" font-size="12">Senior Research Analyst</text>
  <text x="415" y="210" text-anchor="middle" fill="#bae6fd" font-size="11">Data Mining • Fact Extraction</text>

  <!-- Arrow 2 -->
  <path d="M 415 245 L 415 285" stroke="#a855f7" stroke-width="3" fill="none"/>
  <polygon points="415,285 410,275 420,275" fill="#a855f7"/>

  <!-- Agent 2: Lead Technical Writer -->
  <rect x="300" y="295" width="230" height="120" rx="12" fill="url(#grad2)" filter="url(#shadow)"/>
  <text x="415" y="330" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">✍️ Writing Agent</text>
  <text x="415" y="355" text-anchor="middle" fill="#f3e8ff" font-size="12">Lead Content Writer</text>
  <text x="415" y="380" text-anchor="middle" fill="#e9d5ff" font-size="11">Synthesis • Technical Structure</text>

  <!-- Arrow 3 -->
  <path d="M 530 355 L 590 355" stroke="#10b981" stroke-width="3" fill="none"/>
  <polygon points="590,355 580,350 580,360" fill="#10b981"/>

  <!-- Agent 3: Chief Editor & QA -->
  <rect x="600" y="295" width="230" height="120" rx="12" fill="url(#grad3)" filter="url(#shadow)"/>
  <text x="715" y="330" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">📋 Reviewer Agent</text>
  <text x="715" y="355" text-anchor="middle" fill="#ecfdf5" font-size="12">Chief Editor &amp; QA Specialist</text>
  <text x="715" y="380" text-anchor="middle" fill="#a7f3d0" font-size="11">Fact-Check • Polish • QA Sign-Off</text>

  <!-- Arrow 4 to Output -->
  <path d="M 715 295 L 715 255" stroke="#38bdf8" stroke-width="3" fill="none"/>
  <polygon points="715,255 710,265 720,265" fill="#38bdf8"/>

  <!-- Output Box -->
  <rect x="600" y="140" width="230" height="90" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>
  <text x="715" y="175" text-anchor="middle" fill="#38bdf8" font-size="14" font-weight="600">PUBLISHED REPORT</text>
  <text x="715" y="200" text-anchor="middle" fill="#cbd5e1" font-size="12">Executive Markdown / PDF</text>

  <!-- Bottom Legend -->
  <rect x="50" y="445" width="800" height="35" rx="8" fill="#1e293b"/>
  <text x="450" y="468" text-anchor="middle" fill="#94a3b8" font-size="12">Sequential Execution Pipeline: Context Handoff via Pydantic Schemas &amp; Task State Sync</text>
</svg>
